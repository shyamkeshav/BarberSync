name: BarberSync CI

# This defines when the "Robot" wakes up
on:
  push:
    branches: [ development, main ]
  pull_request:
    branches: [ development, main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest # It spins up a fresh Linux machine
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 # Downloads your code onto the Linux machine

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci # Faster, "clean" install for servers

      - name: Run Vitest (The John Snow Guard)
        run: npm test # If this fails, the whole job stops here!

      - name: Build Next.js App
        run: npm run build # Checks if the project actually compiles
        env:
          # We provide "Dummy" keys so the build doesn't crash on the server
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder